[package]
name = "pairwire-audio"
description = "Audio capture (cpal) and Opus encoding/decoding pipeline"
edition.workspace = true
version.workspace = true

[features]
# Enable real microphone capture and speaker playback via cpal.
capture = ["dep:cpal"]

[dependencies]
pairwire-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
opus = "0.3"

[dependencies.cpal]
version = "0.17"
optional = true
