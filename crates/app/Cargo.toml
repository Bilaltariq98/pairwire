[package]
name = "pairwire"
description = "P2P screen sharing and pair programming tool"
edition.workspace = true
version.workspace = true

[[bin]]
name = "pairwire"
path = "src/main.rs"

[dependencies]
pairwire-core.workspace = true
pairwire-protocol.workspace = true
pairwire-transport.workspace = true
pairwire-capture = { path = "../capture" }
pairwire-audio = { path = "../audio" }
pairwire-input.workspace = true
pairwire-terminal.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand = "0.9"
arboard = { workspace = true, optional = true }

[features]
default = ["tray"]
# Enable the graphical viewer. Requires a display and GPU.
gui = ["dep:egui", "dep:eframe"]
# Enable the macOS menu bar / system tray icon.
tray = ["dep:tray-icon", "dep:arboard", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:core-foundation"]
# Enable H.264 encode/decode. Requires system FFmpeg libraries.
encode = ["pairwire-capture/ffmpeg"]
# Enable real screen capture via scap. Requires OS screen recording permission.
capture = ["pairwire-capture/capture"]
# Enable real microphone capture and speaker playback via cpal.
audio = ["pairwire-audio/capture"]
# Alias so `--features pairwire/ffmpeg` works as expected.
ffmpeg = ["encode"]

[dependencies.egui]
workspace = true
optional = true

[dependencies.eframe]
workspace = true
optional = true

[dependencies.tray-icon]
optional = true
version = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSRunningApplication"] }
core-foundation = { version = "0.10", optional = true }
