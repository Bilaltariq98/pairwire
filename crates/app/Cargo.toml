[package]
name = "pairwire"
description = "P2P screen sharing and pair programming tool"
edition.workspace = true
version.workspace = true

[[bin]]
name = "pairwire"
path = "src/main.rs"

[dependencies]
pairwire-core.workspace = true
pairwire-protocol.workspace = true
pairwire-transport.workspace = true
pairwire-capture = { path = "../capture" }
pairwire-audio = { path = "../audio" }
pairwire-input.workspace = true
pairwire-terminal.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand = "0.9"

[features]
# Enable the graphical viewer. Requires a display and GPU.
gui = ["dep:egui", "dep:eframe"]
# Enable H.264 encode/decode. Requires system FFmpeg libraries.
encode = ["pairwire-capture/ffmpeg"]
# Enable real screen capture via scap. Requires OS screen recording permission.
capture = ["pairwire-capture/capture"]
# Enable real microphone capture and speaker playback via cpal.
audio = ["pairwire-audio/capture"]
# Alias so `--features pairwire/ffmpeg` works as expected.
ffmpeg = ["encode"]

[dependencies.egui]
workspace = true
optional = true

[dependencies.eframe]
workspace = true
optional = true
