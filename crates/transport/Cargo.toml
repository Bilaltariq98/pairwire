[package]
name = "pairwire-transport"
description = "iroh P2P connectivity and QUIC stream/datagram helpers"
edition.workspace = true
version.workspace = true

[dependencies]
pairwire-core.workspace = true
pairwire-protocol.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
postcard = { version = "1", features = ["alloc"] }
bytes.workspace = true
tracing.workspace = true
hex = "0.4"
iroh.workspace = true
data-encoding.workspace = true
pairwire-capture = { path = "../capture" }
moq-lite = "0.15"
web-transport-trait = "0.3"
n0-watcher = "0.6"

[dev-dependencies]
rand = "0.9"
tokio = { version = "1", features = ["full"] }
pairwire-protocol = { path = "../protocol", features = ["test-support"] }
