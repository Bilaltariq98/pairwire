[package]
name = "pairwire-telemetry"
description = "Opt-in telemetry and crash reporting for pairwire (PostHog EU + Sentry EU)"
edition.workspace = true
version.workspace = true

[dependencies]
# Error handling — matches workspace convention
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }

# Telemetry backends
# EXACT version pin: sentry is pre-1.0 and breaks on minor bumps.
sentry = { version = "=0.48.2", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
# posthog-rs 0.13.x uses a builder-style API (Client::new, Event::new).
posthog-rs = "0.13.1"

# Device ID — generated once, persisted, never PII
uuid = { version = "1", features = ["v4", "serde"] }

# OS config directory (e.g. ~/Library/Application Support on macOS)
# Plan Step 1.1 noted "dirs = 5" but cargo search (2026-06-18) confirmed
# latest stable is 6.0.0. Using 6 is correct; plan hint was outdated.
dirs = "6"

# TOML config persistence
# Plan Step 1.1 noted "toml = 0.8" but cargo search (2026-06-18) confirmed
# latest stable is 1.1.2. Using 1 is correct; plan hint was outdated.
toml = "1"

# JSON serialisation for building PostHog property maps (production dep — used in posthog.rs)
serde_json = "1"

# tokio::spawn is used in posthog.rs for fire-and-forget dispatch.
# Library crates must NOT request rt-multi-thread (that's for binaries only).
# `rt` alone is sufficient for spawn; the calling binary's runtime is used at
# runtime. posthog-rs (async-client feature, a direct dep) already brings tokio
# into the graph — we declare it here explicitly so the compiler can resolve
# `tokio::spawn`, using only the minimal `rt` feature set.
tokio = { workspace = true, features = ["rt"] }

[features]
# Expose test helpers (fake sink) for integration tests.
test-support = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
