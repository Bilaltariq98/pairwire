name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── macOS (primary target) ────────────────────────────────────────────────
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install FFmpeg (for encode feature)
        run: brew install ffmpeg pkg-config

      - name: Set FFmpeg bindgen env
        run: |
          FFMPEG_PREFIX=$(brew --prefix ffmpeg)
          echo "FFMPEG_DIR=${FFMPEG_PREFIX}" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I${FFMPEG_PREFIX}/include" >> "$GITHUB_ENV"

      - name: Check (default features)
        run: cargo check --workspace

      - name: Check (encode feature)
        run: cargo check --workspace --features pairwire/encode

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy (encode feature)
        run: cargo clippy --workspace --features pairwire/encode -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ── Linux ─────────────────────────────────────────────────────────────────
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev

      - name: Check (default features)
        run: cargo check --workspace

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ── Windows ───────────────────────────────────────────────────────────────
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry\index
            ~\.cargo\registry\cache
            ~\.cargo\git\db
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Check (default features)
        run: cargo check --workspace

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace
